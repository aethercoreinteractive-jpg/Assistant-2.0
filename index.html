<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aria - Autonomous Anime Companion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes floatAnime {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes animeBlink {
            0%, 85%, 100% { transform: scaleY(1); }
            90% { transform: scaleY(0.1); }
        }
        @keyframes animeTalk {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.8); }
        }
        .animate-float { animation: floatAnime 3s ease-in-out infinite; }
        .anime-eyes { animation: animeBlink 4s infinite; transform-origin: center; }
        .is-talking .anime-mouth { animation: animeTalk 0.2s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-white h-[100dvh] w-screen overflow-hidden flex flex-col justify-between select-none font-sans m-0 p-0 box-border">

    <!-- Top Status Bar -->
    <header class="w-full px-4 py-2.5 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 flex justify-between items-center z-10 shrink-0">
        <span class="text-xs font-semibold tracking-wide text-cyan-400 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Groq Lightning Core Active
        </span>
        <span id="timer-display" class="text-xs font-mono px-2.5 py-0.5 bg-cyan-500/10 text-cyan-300 border border-cyan-500/20 rounded-full">00:00</span>
    </header>

    <!-- Main Workspace Area with Persistent Chat Log -->
    <main class="flex-1 flex flex-col justify-end p-3 relative overflow-hidden">
        <div id="chat-log" class="w-full flex-1 overflow-y-auto space-y-2 mb-2 pr-1 flex flex-col justify-end">
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-xl p-2.5 max-w-[85%] self-start text-xs text-slate-300">
                <span class="text-[10px] text-cyan-400 font-semibold block mb-0.5">Aria</span>
                Hey! Groq engine is locked and loaded. What's on your mind?
            </div>
        </div>
    </main>

    <!-- Floating Draggable Anime Companion Widget -->
    <div id="companion" class="absolute bottom-28 right-4 cursor-grab active:cursor-grabbing z-50 animate-float flex flex-col items-center touch-none">
        
        <!-- High-End Anime SVG Avatar Container -->
        <div id="avatar-container" class="w-16 h-16 bg-gradient-to-b from-slate-900 to-indigo-950 rounded-2xl p-1 shadow-2xl shadow-cyan-500/20 border-2 border-cyan-400/50 flex items-center justify-center relative overflow-hidden">
            
            <svg viewBox="0 0 100 100" class="w-full h-full">
                <!-- Hair Background Base -->
                <path d="M20,40 Q50,15 80,40 Q90,70 85,90 Q50,95 15,90 Q10,70 20,40 Z" fill="#1e1b4b"/>
                <!-- Face Skin Tone -->
                <path d="M28,35 Q50,25 72,35 Q80,60 72,82 Q50,90 28,82 Q20,60 28,35 Z" fill="#fed7aa"/>
                <!-- Anime Eye Left -->
                <g class="anime-eyes">
                    <ellipse cx="38" cy="55" rx="7" ry="9" fill="#0f172a"/>
                    <ellipse cx="38" cy="56" rx="5" ry="7" fill="#0284c7"/>
                    <circle cx="36" cy="53" r="2" fill="#ffffff"/>
                </g>
                <!-- Anime Eye Right -->
                <g class="anime-eyes">
                    <ellipse cx="62" cy="55" rx="7" ry="9" fill="#0f172a"/>
                    <ellipse cx="62" cy="56" rx="5" ry="7" fill="#0284c7"/>
                    <circle cx="60" cy="53" r="2" fill="#ffffff"/>
                </g>
                <!-- Eyelashes / Eyebrows -->
                <path d="M30,46 Q38,43 46,47" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M54,47 Q62,43 70,46" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
                <!-- Blush -->
                <ellipse cx="32" cy="66" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
                <ellipse cx="68" cy="66" rx="4" ry="2" fill="#fb7185" opacity="0.6"/>
                <!-- Nose -->
                <circle cx="50" cy="64" r="0.8" fill="#c2410c"/>
                <!-- Mouth -->
                <path id="anime-mouth" class="anime-mouth" d="M45,72 Q50,76 55,72" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" transform-origin="50 73"/>
                <!-- Front Bangs -->
                <path d="M25,32 Q50,18 75,32 Q65,45 50,38 Q35,45 25,32 Z" fill="#312e81"/>
                <path d="M35,35 Q50,50 42,32 Z" fill="#312e81"/>
                <path d="M65,35 Q50,50 58,32 Z" fill="#312e81"/>
            </svg>
        </div>
    </div>

    <!-- Bottom Controls & Text Input Footer -->
    <footer class="w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-3 flex flex-col gap-2 z-10 shrink-0">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Type something, buddy..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
            <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-xs font-medium shadow-lg shadow-cyan-600/30">Send</button>
        </form>
        <div class="flex justify-between items-center text-[10px] text-slate-500 px-1">
            <span>Persistent Log: Active</span>
            <button id="block-btn" class="text-red-400 hover:underline">Simulate App Block</button>
        </div>
    </footer>

    <!-- App Block Modal Overlay -->
    <div id="block-screen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 hidden flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 bg-red-500/20 border border-red-500/40 rounded-full flex items-center justify-center mb-4 text-2xl">⏳</div>
        <h2 class="text-xl font-bold mb-2">Whoa, time's up!</h2>
        <p class="text-xs text-slate-400 max-w-xs mb-6">Let's take a quick break, alright?</p>
        <button id="dismiss-block" class="w-full max-w-xs py-3 bg-cyan-600 text-white rounded-xl text-xs font-medium shadow-lg">Let's get back</button>
    </div>

    <!-- Script with Verified Production Model ID -->
    <script>
        const GROQ_API_KEY = "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";

        const companion = document.getElementById('companion');
        const avatarContainer = document.getElementById('avatar-container');
        const chatLog = document.getElementById('chat-log');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const blockBtn = document.getElementById('block-btn');
        const blockScreen = document.getElementById('block-screen');
        const dismissBlock = document.getElementById('dismiss-block');
        const timerDisplay = document.getElementById('timer-display');

        let secondsElapsed = 0;

        // Screen Time Counter
        setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;

            if (secondsElapsed === 120) {
                blockScreen.classList.remove('hidden');
                callGroq("Hey, looks like we've been at this for a bit. Want to lock things down for a second?");
            }
        }, 1000);

        blockBtn.addEventListener('click', () => {
            blockScreen.classList.remove('hidden');
            callGroq("App block triggered!");
        });

        dismissBlock.addEventListener('click', () => {
            blockScreen.classList.add('hidden');
            secondsElapsed = 0;
            callGroq("We're back!");
        });

        // Add message to persistent chat log
        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            const isUser = sender === 'You';
            msgDiv.className = `p-2.5 rounded-xl max-w-[85%] text-xs ${isUser ? 'bg-cyan-950/80 border border-cyan-800/60 self-end text-cyan-100' : 'bg-slate-900/80 border border-slate-800/80 self-start text-slate-300'}`;
            msgDiv.innerHTML = `<span class="text-[10px] ${isUser ? 'text-cyan-300' : 'text-cyan-400'} font-semibold block mb-0.5">${sender}</span>${text}`;
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Text-to-Speech Speaker Engine & Mouth Animation
        function speakAloud(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.2;
                utterance.volume = 1.0;
                
                utterance.onstart = () => {
                    avatarContainer.classList.add('is-talking', 'border-red-400');
                };
                utterance.onend = () => {
                    avatarContainer.classList.remove('is-talking', 'border-red-400');
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        // Fast Groq API Connection Function
        async function callGroq(promptText) {
            appendMessage('You', promptText);

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        messages: [
                            {
                                role: "system",
                                content: "You are Aria, a close, friendly anime companion. Talk casually like a best friend, use friendly language, and avoid sounding formal, robotic, or like a servant. Keep answers short and sweet so they are easy to speak aloud."
                            },
                            {
                                role: "user",
                                content: promptText
                            }
                        ]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0].message.content) {
                    const aiReply = data.choices[0].message.content.trim();
                    appendMessage('Aria', aiReply);
                    speakAloud(aiReply);
                } else {
                    const errorMsg = data.error?.message || "Oops, having a little trouble connecting right now!";
                    appendMessage('Aria', errorMsg);
                    speakAloud(errorMsg);
                }
            } catch (err) {
                console.error(err);
                const netMsg = "Ah, network glitch on my end!";
                appendMessage('Aria', netMsg);
                speakAloud(netMsg);
            }
        }

        // Greet on startup
        window.addEventListener('load', () => {
            setTimeout(() => {
                callGroq("Hey! Say a warm, casual hello to me.");
            }, 800);
            startContinuousListening();
        });

        // Always-On Voice Detection
        function startContinuousListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    const speechToText = event.results[event.results.length - 1][0].transcript.trim();
                    callGroq(speechToText);
                };

                recognition.onerror = () => {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 1000);
                };
                recognition.onend = () => {
                    try { recognition.start(); } catch(e){}
                };
                try { recognition.start(); } catch(e){}
            }
        }

        // Handle Text Box Form Submission
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;
            userInput.value = '';
            
            callGroq(text);
        });

        // Mobile Touch & Drag Logic
        let startX, startY, initialX, initialY, isDragging = false;

        companion.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            initialX = companion.offsetLeft;
            initialY = companion.offsetTop;
            companion.style.bottom = 'auto';
            companion.style.right = 'auto';
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            companion.style.left = `${Math.max(10, Math.min(window.innerWidth - 80, initialX + dx))}px`;
            companion.style.top = `${Math.max(40, Math.min(window.innerHeight - 160, initialY + dy))}px`;
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });
    </script>
</body>
</html>
